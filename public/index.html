<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Velvet Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #080808;
      color: #e0e0e0;
      /* ป้องกันการเลื่อนหน้าจอทั้งหน้า */
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Elements */
    .rain-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.15;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.05));
    }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #111111;
      border: 1px solid #222;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
      z-index: 2;
    }

    @media (min-width: 769px) {
      .app-container {
        height: 85vh;
        border-radius: 16px;
        overflow: hidden;
      }
    }

    /* Top Bar / Header */
    .chat-header {
      padding: 16px 20px;
      background: #161616;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding-top: max(16px, env(safe-area-inset-top)); /* รองรับรอยบากมือถือ */
    }

    .partner-info {
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: #aaa;
      text-transform: uppercase;
      font-weight: 500;
    }

    .status-badge {
      font-size: 0.75rem;
      background: #222;
      padding: 4px 10px;
      border-radius: 12px;
      color: #888;
      border: 1px solid #333;
    }

    /* Messages Area */
    .messages-container {
      flex: 1 1 auto;
      padding: 20px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch; /* ให้เลื่อนลื่นขึ้นบน iOS */
    }

    .msg-bubble {
      max-width: 80%;
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      animation: fadeIn 0.2s ease;
    }

    .msg-self {
      align-self: flex-end;
      background: #ffffff;
      color: #000000;
      border-bottom-right-radius: 4px;
    }

    .msg-partner {
      align-self: flex-start;
      background: #222222;
      color: #ffffff;
      border-bottom-left-radius: 4px;
      border: 1px solid #2a2a2a;
    }

    .system-msg {
      align-self: center;
      font-size: 0.8rem;
      color: #666;
      margin: 8px 0;
      text-align: center;
    }

    /* Bottom Input Bar */
    .chat-input-area {
      padding: 12px 16px;
      background: #161616;
      border-top: 1px solid #222;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-input-area input {
      flex: 1;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      padding: 12px 16px;
      border-radius: 24px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: #444;
    }

    .chat-input-area button {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Bottom Toolbar / Action Buttons */
    .bottom-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom)); /* เว้นที่ให้ Home Indicator ของ iOS */
      background: #111111;
      font-size: 0.75rem;
      color: #666;
      flex-shrink: 0;
    }

    .btn-action {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #ccc;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn-action:hover { background: #262626; }
    .btn-report-btn { color: #ff6b6b; border-color: #4a2222; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="rain-overlay"></div>

  <div class="app-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="partner-info" id="partner-info">CONNECTED WITH 🐾 ...</div>
      <div class="status-badge" id="online-count">🟢 ONLINE</div>
    </div>

    <!-- Messages Box -->
    <div class="messages-container" id="messages">
      <div class="system-msg">ยินดีต้อนรับสู่ Velvet Chat กด "เริ่มสุ่มคุย" เพื่อค้นหาคู่สนทนา</div>
    </div>

    <!-- Input Bar -->
    <div class="chat-input-area">
      <input type="text" id="msg-input" placeholder="พิมพ์ข้อความ..." disabled onkeypress="handleKeyPress(event)">
      <button id="send-btn" onclick="sendMessage()" disabled>➔</button>
    </div>

    <!-- Bottom Bar & Controls (ย้ายเข้ามาใน app-container เพื่อไม่ให้ทะลุจอบนมือถือ) -->
    <div class="bottom-bar">
      <div>
        <button class="btn-action" id="start-btn" onclick="startSearch()">🔍 เริ่มสุ่มคุย</button>
        <button class="btn-action" id="exit-btn" onclick="leaveChat()" style="display:none;">🚪 ออกจากแชท</button>
        <button class="btn-action btn-report-btn" id="report-btn" onclick="reportPartner()" style="display:none;">🚨 REPORT</button>
      </div>
      <div>🌧️ RAIN: ON</div>
    </div>
  </div>

  <script>
    const socket = io();
    let isSeated = false;

    const messagesBox = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const partnerInfo = document.getElementById('partner-info');
    const startBtn = document.getElementById('start-btn');
    const reportBtn = document.getElementById('report-btn');
    const exitBtn = document.getElementById('exit-btn');

    function scrollToBottom() {
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function addSystemMsg(text) {
      const div = document.createElement('div');
      div.className = 'system-msg';
      div.innerText = text;
      messagesBox.appendChild(div);
      scrollToBottom();
    }

    function addBubble(text, isSelf) {
      const div = document.createElement('div');
      div.className = `msg-bubble ${isSelf ? 'msg-self' : 'msg-partner'}`;
      div.innerText = text;
      messagesBox.appendChild(div);
      scrollToBottom();
    }

    function startSearch() {
      if(socket) socket.emit('sit');
      startBtn.disabled = true;
      startBtn.innerText = '⏳ กำลังค้นหา...';
    }

    function leaveChat() {
      if(socket) socket.emit('leave');
      resetUI();
    }

    function reportPartner() {
      if (confirm('คุณต้องการรายงานผู้ใช้นี้เข้ากลุ่ม Telegram ใช่หรือไม่?')) {
        if(socket) socket.emit('report', { reason: 'พฤติกรรมไม่เหมาะสม / พิมพ์คำไม่สุภาพ' });
        addSystemMsg('🚨 ส่งรายงานไปยังแอดมินทาง Telegram เรียบร้อยแล้ว');
        leaveChat();
      }
    }

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !isSeated) return;

      addBubble(text, true);
      msgInput.value = '';
      if(socket) socket.emit('msg', text);
      
      // คืนโฟกัสให้กล่องข้อความเมื่อส่งเสร็จ (สะดวกบนคอม แต่บนมือถือจะช่วยไม่ให้คีย์บอร์ดหุบ)
      msgInput.focus();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function resetUI() {
      isSeated = false;
      msgInput.disabled = true;
      sendBtn.disabled = true;
      startBtn.style.display = 'inline-block';
      startBtn.disabled = false;
      startBtn.innerText = '🔍 เริ่มสุ่มคุย';
      reportBtn.style.display = 'none';
      exitBtn.style.display = 'none';
      partnerInfo.innerText = 'CONNECTED WITH 🐾 ...';
    }

    // Socket Events (ตรวจสอบว่ามี socket ป้องกัน Error หากเปิดทดสอบบนเครื่องเปล่า)
    if(socket) {
      socket.on('online', (count) => {
        document.getElementById('online-count').innerText = `🟢 ONLINE: ${count}`;
      });

      socket.on('waiting', () => {
        addSystemMsg('⏳ กำลังค้นหาคู่สนทนา...');
      });

      socket.on('seated', (data) => {
        isSeated = true;
        messagesBox.innerHTML = '';
        addSystemMsg(`🎉 เชื่อมต่อสำเร็จ! คุณกำลังคุยกับ ${data.emoji} ${data.partner}`);

        partnerInfo.innerText = `CONNECTED WITH ${data.emoji} ${data.partner}`;
        msgInput.disabled = false;
        sendBtn.disabled = false;
        msgInput.focus();

        startBtn.style.display = 'none';
        reportBtn.style.display = 'inline-block';
        exitBtn.style.display = 'inline-block';
      });

      socket.on('msg', (data) => {
        addBubble(data.text, false);
      });

      socket.on('ended', (data) => {
        addSystemMsg('❌ การสนทนาสิ้นสุดลงแล้ว');
        resetUI();
      });

      socket.on('cooldown', (data) => {
        const mins = Math.ceil(data.ms / 60000);
        alert(`⚠️ คุณถูกระงับการใช้งานชั่วคราว ${mins} นาที`);
        resetUI();
      });
    }
  </script>
</body>
</html>
