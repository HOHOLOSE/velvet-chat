<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Velvet Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Outer Wrapper */
    .app-container {
      width: 100%;
      max-width: 900px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      background: #141414;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    @media (min-width: 769px) {
      .app-container {
        height: 90vh;
        border-radius: 16px;
        border: 1px solid #282828;
      }
    }

    /* Sidebar ฝั่งซ้าย */
    .sidebar {
      width: 260px;
      background: #1a1a1a;
      border-right: 1px solid #262626;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      z-index: 20;
      transition: transform 0.3s ease;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .online-count {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 20px;
    }

    .profile-box {
      background: #222;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .profile-box input {
      width: 100%;
      background: #181818;
      border: 1px solid #333;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .sidebar-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-report { background: #3a1515; color: #ff6b6b; border: 1px solid #5a2222; }
    .btn-report:hover { background: #5a2222; }
    .btn-exit { background: #262626; color: #ccc; }
    .btn-exit:hover { background: #333; }
    .btn-start { background: #fff; color: #000; font-weight: 600; padding: 12px; }

    /* Main Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background: #111;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      height: 55px;
      padding: 0 16px;
      background: #161616;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .partner-info {
      font-size: 0.9rem;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* กล่องแสดงข้อความ (Scrollable Container) */
    .messages-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch; /* เลื่อนลื่นบน iOS */
    }

    .msg-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      animation: fadeIn 0.15s ease-in-out;
    }

    .msg-self {
      align-self: flex-end;
      background: #e0e0e0;
      color: #111;
      border-bottom-right-radius: 2px;
    }

    .msg-partner {
      align-self: flex-start;
      background: #222;
      color: #eee;
      border-bottom-left-radius: 2px;
      border: 1px solid #2a2a2a;
    }

    .system-msg {
      align-self: center;
      font-size: 0.8rem;
      color: #666;
      margin: 6px 0;
      text-align: center;
    }

    /* ช่องพิมพ์ข้อความด้านล่าง (Locked at Bottom) */
    .chat-input-area {
      padding: 12px 16px;
      background: #161616;
      border-top: 1px solid #222;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0; /* ป้องกันไม่ให้โดนบีบหาย */
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .chat-input-area input {
      flex: 1;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      padding: 12px 16px;
      border-radius: 24px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: #444;
    }

    .chat-input-area button {
      background: #fff;
      color: #000;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 📱 RESPONSIVE สำหรับโทรศัพท์มือถือ */
    @media (max-width: 768px) {
      .mobile-menu-btn {
        display: block;
      }

      .sidebar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 250px;
        transform: translateX(-100%);
        box-shadow: 5px 0 15px rgba(0,0,0,0.5);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .chat-area {
        width: 100%;
      }

      .msg-bubble {
        max-width: 85%; /* ขยายกล่องความกว้างข้อความบนมือถือ */
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar ฝั่งซ้าย -->
    <div class="sidebar" id="sidebar">
      <div>
        <div class="brand">✨ VELVET CHAT</div>
        <div class="online-count" id="online-count">🟢 ออนไลน์: 1 คน</div>

        <div class="profile-box">
          <div style="font-size:0.85rem; color:#aaa; margin-bottom:4px;">สถานะของคุณ</div>
          <input type="text" id="status-input" value="🌧️ เหงา" maxlength="30" placeholder="ระบุสถานะ...">
        </div>
      </div>

      <div class="sidebar-btns">
        <button class="btn btn-start" id="start-btn" onclick="startSearch()">🔍 เริ่มสุ่มคุย</button>
        <button class="btn btn-report" id="report-btn" onclick="reportPartner()" style="display:none;">🚨 รายงาน (REPORT)</button>
        <button class="btn btn-exit" id="exit-btn" onclick="leaveChat()" style="display:none;">🚪 ออกจากแชท</button>
      </div>
    </div>

    <!-- Main Chat Container -->
    <div class="chat-area">
      <!-- Header -->
      <div class="chat-header">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="partner-info" id="partner-info">ไม่ได้เชื่อมต่อ</div>
        <div id="timer" style="font-size:0.85rem; color:#888;"></div>
      </div>

      <!-- Messages Box (Scrollable) -->
      <div class="messages-container" id="messages">
        <div class="system-msg">ยินดีต้อนรับสู่ Velvet Chat กด "เริ่มสุ่มคุย" เพื่อจับคู่</div>
      </div>

      <!-- Input Bar (Fixed Bottom) -->
      <div class="chat-input-area">
        <input type="text" id="msg-input" placeholder="พิมพ์ข้อความ..." disabled onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()" disabled>➔</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let isSeated = false;

    // Elements
    const messagesBox = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const partnerInfo = document.getElementById('partner-info');
    const startBtn = document.getElementById('start-btn');
    const reportBtn = document.getElementById('report-btn');
    const exitBtn = document.getElementById('exit-btn');
    const sidebar = document.getElementById('sidebar');

    function toggleSidebar() {
      sidebar.classList.toggle('open');
    }

    function scrollToBottom() {
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function addSystemMsg(text) {
      const div = document.createElement('div');
      div.className = 'system-msg';
      div.innerText = text;
      messagesBox.appendChild(div);
      scrollToBottom();
    }

    function addBubble(text, isSelf) {
      const div = document.createElement('div');
      div.className = `msg-bubble ${isSelf ? 'msg-self' : 'msg-partner'}`;
      div.innerText = text;
      messagesBox.appendChild(div);
      scrollToBottom();
    }

    function startSearch() {
      socket.emit('sit');
      startBtn.disabled = true;
      startBtn.innerText = '⏳ กำลังค้นหาคู่คุย...';
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    }

    function leaveChat() {
      socket.emit('leave');
      resetUI();
    }

    function reportPartner() {
      if (confirm('คุณต้องการรายงานผู้ใช้นี้ใช่หรือไม่?')) {
        socket.emit('report', { reason: 'พฤติกรรมไม่เหมาะสม' });
        addSystemMsg('🚨 คุณได้ส่งรายงานพฤติกรรมเรียบร้อยแล้ว');
        leaveChat();
      }
    }

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !isSeated) return;

      addBubble(text, true);
      msgInput.value = '';
      socket.emit('msg', text);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function resetUI() {
      isSeated = false;
      msgInput.disabled = true;
      sendBtn.disabled = true;
      startBtn.style.display = 'block';
      startBtn.disabled = false;
      startBtn.innerText = '🔍 เริ่มสุ่มคุย';
      reportBtn.style.display = 'none';
      exitBtn.style.display = 'none';
      partnerInfo.innerText = 'ไม่ได้เชื่อมต่อ';
    }

    // Socket Events
    socket.on('online', (count) => {
      document.getElementById('online-count').innerText = `🟢 ออนไลน์: ${count} คน`;
    });

    socket.on('waiting', () => {
      addSystemMsg('⏳ กำลังค้นหาคู่สนทนาที่เหมาะสม...');
    });

    socket.on('seated', (data) => {
      isSeated = true;
      messagesBox.innerHTML = '';
      addSystemMsg(`🎉 เชื่อมต่อกับคู่สนทนาเรียบร้อย (${data.emoji} ${data.partner})`);

      partnerInfo.innerText = `${data.emoji} ${data.partner} (${data.status})`;
      msgInput.disabled = false;
      sendBtn.disabled = false;
      msgInput.focus();

      startBtn.style.display = 'none';
      reportBtn.style.display = 'block';
      exitBtn.style.display = 'block';
    });

    socket.on('msg', (data) => {
      addBubble(data.text, false);
    });

    socket.on('ended', (data) => {
      addSystemMsg('❌ การสนทนาสิ้นสุดลงแล้ว');
      resetUI();
    });

    socket.on('cooldown', (data) => {
      const mins = Math.ceil(data.ms / 60000);
      alert(`⚠️ คุณถูกระงับการใช้งานชั่วคราวเป็นเวลา ${mins} นาที`);
      resetUI();
    });

    // อัปเดตสถานะส่วนตัว
    document.getElementById('status-input').addEventListener('change', (e) => {
      socket.emit('update-profile', { status: e.target.value });
    });
  </script>
</body>
</html>
