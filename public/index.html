<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VELVET CHAT - AM EDITION</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: url('https://cur.cursors-4u.net/user/use-1/use153.cur'), default !important;
      -webkit-tap-highlight-color: transparent;
    }

    button, select, input, .btn, .bgm-bar, a, .rain-toggle {
      cursor: url('https://cur.cursors-4u.net/user/use-1/use154.cur'), pointer !important;
    }

    body {
      background-color: #0b0b0b;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh; /* ล็อกความสูงพอดีจอ ป้องกันบั๊กเลื่อนขึ้นลง */
      overflow: hidden;
      position: relative;
    }

    #rain-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
    }

    /* จัดการพื้นที่แสดงผลหลักให้ยืดหยุ่น */
    .view-section {
      display: none;
      flex: 1;
      width: 100%;
      height: 100%;
      max-width: 900px;
      /* เว้นที่ด้านล่างให้เมนู Bottom Controls */
      padding: 20px 15px max(60px, calc(20px + env(safe-area-inset-bottom))) 15px; 
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.4s ease-in-out;
      z-index: 10;
    }
    .view-section.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-container { text-align: center; margin-bottom: 20px; }
    .am-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 8px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      animation: neonFlicker 3s infinite alternate;
    }

    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.4), 0 0 20px rgba(255, 255, 255, 0.2);
      }
      20%, 24%, 55% { text-shadow: none; }
    }

    .am-wave-svg { width: 320px; max-width: 90vw; height: 50px; margin: 10px 0; }
    .online-badge {
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: #888888;
      text-transform: uppercase;
    }

    .btn {
      background: #ffffff;
      color: #0b0b0b;
      border: 1px solid #ffffff;
      padding: 14px 32px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 0.2s ease;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .btn:hover {
      background: #0b0b0b;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }
    .btn:active { transform: scale(0.95) translateY(0); }

    .btn-secondary {
      background: transparent;
      color: #888888;
      border: 1px solid #333333;
    }
    .btn-secondary:hover {
      background: #1e1e1e;
      color: #ffffff;
      border-color: #666666;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    #view-landing { gap: 30px; }
    #view-matching { text-align: center; gap: 20px; }
    
    .matching-status {
      font-size: 1.1rem;
      letter-spacing: 4px;
      color: #ffffff;
      text-transform: uppercase;
      margin-top: 10px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
      animation: pulse 1.2s infinite alternate;
    }
    
    .matching-subtext {
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: #666666;
      text-transform: uppercase;
      min-height: 20px;
    }

    .animated-wave path {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: waveDash 1.5s linear infinite;
    }
    @keyframes waveDash { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0% { opacity: 0.3; } 100% { opacity: 1; } }

    .chat-layout {
      display: flex;
      width: 100%;
      height: 100%;
      max-height: 80vh; /* รักษาความเป็นหน้าต่างบน PC */
      background: rgba(17, 17, 17, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid #222222;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
    }

    .sidebar {
      width: 35%;
      background: rgba(13, 13, 13, 0.95);
      border-right: 1px solid #222222;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }
    .profile-card { display: flex; flex-direction: column; gap: 8px; }
    .partner-avatar {
      font-size: 2.8rem;
      text-align: center;
      padding: 8px;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 8px;
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .partner-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      text-align: center;
    }
    
    .status-badge-partner {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #888888;
      text-align: center;
      background: #141414;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #222222;
      word-break: break-all;
    }
    .status-badge-partner a {
      color: #1db954;
      text-decoration: underline;
    }

    .my-animal-box {
      background: #141414;
      border: 1px dashed #333333;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #aaaaaa;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }
    .my-animal-name {
      color: #ffffff;
      font-weight: bold;
    }

    .status-section { margin-top: 4px; }
    .status-label {
      font-size: 0.68rem;
      letter-spacing: 1.5px;
      color: #666666;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .status-select, .now-playing-input {
      width: 100%;
      background: #141414;
      color: #cccccc;
      border: 1px solid #262626;
      padding: 8px 10px;
      border-radius: 4px;
      outline: none;
      font-size: 0.8rem;
      letter-spacing: 1px;
      margin-bottom: 6px;
      transition: border-color 0.2s;
    }
    .status-select:hover, .now-playing-input:focus { border-color: #555555; }

    .sidebar-footer { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .datetime-display {
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      color: #666666;
      text-transform: uppercase;
      text-align: center;
    }
    .cigarette-timer-container {
      background: #141414;
      border: 1px solid #222222;
      padding: 8px 10px;
      border-radius: 6px;
    }
    .cigarette-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      color: #888888;
      margin-bottom: 6px;
    }
    
    .speed-warning { color: #ff4444; font-weight: bold; animation: pulse 0.8s infinite alternate; }

    .cigarette-bar {
      height: 8px;
      background: #222222;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      display: flex;
    }
    .cigarette-filter { width: 20%; height: 100%; background: #c28846; }
    .cigarette-body { height: 100%; background: #e0e0e0; transition: width 0.3s ease; }
    .cigarette-ash { width: 8px; height: 100%; background: #ff4500; box-shadow: 0 0 6px #ff4500; }

    .chat-area { width: 65%; display: flex; flex-direction: column; background: rgba(17, 17, 17, 0.95); }
    .messages-container {
      flex: 1;
      padding: 15px;
