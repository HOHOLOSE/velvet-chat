<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VELVET CHAT - AM EDITION</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: url('https://cur.cursors-4u.net/user/use-1/use153.cur'), default !important;
      -webkit-tap-highlight-color: transparent;
    }

    button, select, input, .btn, .bgm-bar, a, .rain-toggle {
      cursor: url('https://cur.cursors-4u.net/user/use-1/use154.cur'), pointer !important;
    }

    body {
      background-color: #050505;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* ฉากหลังสายฝน - อยู่หลังสุด */
    #rain-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .view-section {
      display: none;
      flex: 1;
      width: 100%;
      height: 100%;
      max-width: 950px;
      padding: 25px 20px max(70px, calc(25px + env(safe-area-inset-bottom))) 20px; 
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }
    .view-section.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-container { text-align: center; margin-bottom: 35px; z-index: 10; }
    .am-title {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 14px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
    }

    .am-wave-svg { width: 340px; max-width: 90vw; height: 50px; margin: 15px 0; }
    .online-badge {
      font-size: 0.75rem;
      letter-spacing: 5px;
      color: #888888;
      text-transform: uppercase;
      background: rgba(20, 20, 20, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: inline-block;
      backdrop-filter: blur(4px);
    }

    .btn {
      background: #ffffff;
      color: #050505;
      border: 1px solid #ffffff;
      padding: 14px 32px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }
    .btn:hover {
      background: #000000;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    }
    .btn:active { transform: scale(0.96); }

    .btn-secondary {
      background: rgba(20, 20, 20, 0.8);
      color: #aaaaaa;
      border: 1px solid #333333;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #ffffff;
      color: #050505;
      border-color: #ffffff;
    }

    #view-landing { gap: 30px; }
    #view-matching { text-align: center; gap: 20px; }
    
    .matching-status {
      font-size: 1.1rem;
      letter-spacing: 6px;
      color: #ffffff;
      text-transform: uppercase;
      margin-top: 15px;
      animation: pulse 1.5s infinite alternate;
    }
    
    .matching-subtext {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: #666666;
      text-transform: uppercase;
      min-height: 20px;
    }

    .animated-wave path {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: waveDash 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes waveDash { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0% { opacity: 0.3; } 100% { opacity: 1; } }

    /* หน้าต่างแชท Glassmorphism - ทึบพอที่จะบังฝนด้านหลัง */
    .chat-layout {
      display: flex;
      width: 100%;
      height: 100%;
      max-height: 82vh;
      background: rgba(12, 12, 12, 0.85); /* สีพื้นเข้มขึ้น */
      backdrop-filter: blur(16px); /* เบลอฝนด้านหลังให้เป็นโบเก้ */
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }

    .sidebar {
      width: 35%;
      background: rgba(6, 6, 6, 0.6);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }
    
    .partner-avatar, .my-animal-name { filter: grayscale(80%) contrast(120%); }
    
    .profile-card { display: flex; flex-direction: column; gap: 15px; }
    .partner-avatar {
      font-size: 3rem;
      text-align: center;
      padding: 15px;
      background: rgba(25, 25, 25, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
    }
    
    .partner-name {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #ffffff;
      text-align: center;
      text-transform: uppercase;
    }
    
    .status-badge-partner {
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: #888888;
      text-align: center;
      margin-top: 4px;
      word-break: break-all;
    }
    .status-badge-partner a { color: #ffffff; text-decoration: none; border-bottom: 1px dashed #666; transition: 0.2s; }
    .status-badge-partner a:hover { border-bottom-color: #fff; }

    .my-animal-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 15px;
      border-radius: 6px;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: #777777;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 5px;
    }
    .my-animal-name { color: #ffffff; font-weight: bold; }

    .status-section { margin-top: 5px; }
    .status-label {
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: #555555;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .status-select, .now-playing-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 12px;
      border-radius: 4px;
      outline: none;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
      transition: all 0.2s;
    }
    .status-select:focus, .now-playing-input:focus { border-color: #888888; background: rgba(0,0,0,0.6); }

    .sidebar-footer { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; }
    
    /* นาฬิกาแบบสวยเท่ และ บุหรี่ที่สมจริงขึ้น */
    .cigarette-timer-container {
      background: rgba(0, 0, 0, 0.4);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .cigarette-label {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: #777777;
      margin-bottom: 10px;
    }
    
    .speed-warning { color: #ff3300; font-weight: bold; text-shadow: 0 0 5px rgba(255,51,0,0.5); }

    .cigarette-bar {
      height: 8px;
      background: rgba(25, 25, 25, 0.8);
      border-radius: 4px;
      position: relative;
      display: flex;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
    }
    .cigarette-filter { 
      width: 20%; 
      height: 100%; 
      background: linear-gradient(90deg, #96673d, #c28846); 
      border-radius: 4px 0 0 4px;
    }
    .cigarette-body { 
      height: 100%; 
      background: linear-gradient(180deg, #e0e0e0, #ffffff); 
      transition: width 1s linear; 
    }
    .cigarette-ash { 
      width: 6px; 
      height: 100%; 
      background: #ff3300; 
      border-radius: 0 4px 4px 0;
      box-shadow: 0 0 10px 2px rgba(255, 51, 0, 0.6), 0 0 2px 1px rgba(255, 255, 255, 0.8) inset; 
    } 

    .datetime-display {
      font-size: 0.7rem;
      letter-spacing: 4px;
      color: #444444;
      text-transform: uppercase;
      text-align: center;
    }

    .chat-area { width: 65%; display: flex; flex-direction: column; background: transparent; }
    .messages-container {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .message-bubble {
      max-width: 75%;
      padding: 12px 18px;
      font-size: 0.88rem;
      line-height: 1.5;
      letter-spacing: 0.5px;
      word-wrap: break-word;
      animation: msgFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message-bubble.me {
      align-self: flex-end;
      background: #ffffff;
      color: #050505;
      font-weight: 500;
      border-radius: 12px 12px 2px 12px;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }
    .message-bubble.partner {
      align-self: flex-start;
      background: rgba(30, 30, 30, 0.7);
      color: #e5e5e5;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px 12px 12px 2px;
    }
    .message-bubble.system {
      align-self: center;
      background: rgba(0, 0, 0, 0.4);
      color: #777777;
      font-size: 0.65rem;
      letter-spacing: 3px;
      padding: 6px 16px;
      border-radius: 20px;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .typing-indicator {
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: #666666;
      padding: 0 25px 10px;
      height: 20px;
      text-transform: uppercase;
      font-style: italic;
    }

    .chat-input-bar {
      display: flex;
      padding: 15px 20px;
      background: rgba(6, 6, 6, 0.8);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      gap: 12px;
    }
    .chat-input {
      flex: 1;
      background: rgba(25, 25, 25, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 6px;
      outline: none;
      font-size: 0.88rem;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }
    .chat-input:focus { border-color: #aaaaaa; background: rgba(30, 30, 30, 0.8); }
    .chat-actions { display: flex; gap: 8px; }
    .chat-actions .btn { padding: 12px 20px; border-radius: 6px; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 999;
      animation: fadeIn 0.2s ease-in-out;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #0c0c0c; border: 1px solid rgba(255, 255, 255, 0.1); padding: 35px;
      border-radius: 12px; text-align: center; max-width: 420px; width: 90%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 1);
    }
    .modal-title { font-size: 1.2rem; letter-spacing: 5px; color: #ffffff; margin-bottom: 12px; }
    .modal-desc { font-size: 0.85rem; letter-spacing: 1px; color: #888888; margin-bottom: 30px; line-height: 1.6; }
    .modal-buttons { display: flex; gap: 15px; justify-content: center; }

    .bottom-controls {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: #666666;
    }

    .bgm-bar, .rain-toggle {
      background: rgba(15, 15, 15, 0.8);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 10px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }
    .bgm-bar:hover, .rain-toggle:hover { color: #ffffff; border-color: rgba(255,255,255,0.3); background: rgba(30,30,30,0.9); }

    .sound-wave-icon {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }
    .sound-wave-icon span {
      width: 2px;
      height: 100%;
      background-color: #ffffff;
      border-radius: 1px;
    }
    .sound-wave-icon.playing span:nth-child(1) { animation: soundWave 0.8s infinite ease-in-out alternate; }
    .sound-wave-icon.playing span:nth-child(2) { animation: soundWave 1.2s infinite ease-in-out alternate 0.2s; }
    .sound-wave-icon.playing span:nth-child(3) { animation: soundWave 0.6s infinite ease-in-out alternate 0.4s; }
    .sound-wave-icon.playing span:nth-child(4) { animation: soundWave 1.0s infinite ease-in-out alternate 0.1s; }

    @keyframes soundWave { 0% { height: 20%; } 100% { height: 100%; } }
    .sound-wave-icon:not(.playing) span { height: 20% !important; animation: none !important; }

    @media (max-width: 768px) {
      .am-title { font-size: 2rem; letter-spacing: 8px; }
      .am-wave-svg { height: 40px; }
      .view-section { padding: 10px 10px max(65px, calc(10px + env(safe-area-inset-bottom))) 10px; }
      .chat-layout { flex-direction: column; height: 100%; max-height: none; border-radius: 8px; }
      .sidebar {
        width: 100%; padding: 15px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05);
        flex-direction: column; gap: 10px; flex-shrink: 0; max-height: 220px; overflow-y: auto;
      }
      .profile-card { flex-direction: column; width: 100%; gap: 10px; }
      .partner-avatar { font-size: 2.2rem; padding: 10px; }
      .chat-area { width: 100%; flex: 1; min-height: 0; }
      .messages-container { padding: 15px; gap: 12px; }
      .chat-input-bar { padding: 12px; gap: 8px; }
      .chat-input { font-size: 0.85rem; padding: 10px 12px; }
      .chat-actions .btn { padding: 10px 14px !important; font-size: 0.7rem; border-radius: 4px; }
      .bottom-controls { bottom: max(12px, env(safe-area-inset-bottom)); left: 15px; right: 15px; }
      .bgm-bar, .rain-toggle { padding: 8px 12px; font-size: 0.6rem; }
    }
  </style>
</head>
<body>

  <!-- ฉากฝนตก (อยู่ด้านหลังสุด) -->
  <canvas id="rain-canvas"></canvas>
  
  <audio id="bgm" loop src="/music/bgm.mp3"></audio>

  <!-- LANDING VIEW -->
  <div id="view-landing" class="view-section active">
    <div class="header-container">
      <h1 class="am-title">VELVET CHAT</h1>
      <svg class="am-wave-svg" viewBox="0 0 320 50">
        <path d="M 0 25 Q 40 25 80 5 Q 120 45 160 5 Q 200 45 240 5 Q 280 25 320 25" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
      </svg>
      <div class="online-badge">ONLINE: <span id="landing-online-count" style="color:#fff;">1</span></div>
    </div>
    <button class="btn" onclick="requestMatch()">MATCH</button>
  </div>

  <!-- MATCHING VIEW -->
  <div id="view-matching" class="view-section">
    <div class="header-container">
      <h1 class="am-title">SEARCHING</h1>
      <svg class="am-wave-svg animated-wave" viewBox="0 0 320 50">
        <path d="M 0 25 Q 40 5 80 45 Q 120 5 160 45 Q 200 5 240 45 Q 280 25 320 25" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      </svg>
      <div class="matching-status">FINDING A STRANGER...</div>
      <div class="matching-subtext" id="matching-subtext">TUNING FREQUENCY...</div>
    </div>
    <button class="btn btn-secondary" onclick="cancelMatch()">CANCEL</button>
  </div>

  <!-- CHAT VIEW -->
  <div id="view-chat" class="view-section">
    <div class="chat-layout">
      <div class="sidebar">
        <div class="profile-card">
          <div class="partner-avatar" id="partner-emoji">🐱</div>
          <div>
            <div class="partner-name" id="partner-name">STRANGER</div>
            <div class="status-badge-partner" id="partner-status-display">AVAILABLE</div>
            <div class="status-badge-partner" id="partner-music-display">VIBE: NONE</div>
          </div>
          
          <div class="status-section">
            <div class="status-label">STATUS</div>
            <select class="status-select" id="my-status" onchange="updateProfileInfo()">
              <option value="AVAILABLE">AVAILABLE</option>
              <option value="VIBING">VIBING</option>
              <option value="DO NOT DISTURB">DO NOT DISTURB</option>
            </select>

            <div class="status-label">MUSIC</div>
            <input type="url" class="now-playing-input" id="my-music" placeholder="Drop URL here..." oninput="updateProfileInfo()">
          </div>

          <div class="my-animal-box">
            <span>IDENTITY</span>
            <span class="my-animal-name" id="my-animal-display">...</span>
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="cigarette-timer-container">
            <div class="cigarette-label">
              <span>CIGARETTE</span>
              <span id="timer-text" style="color: #ffffff; font-weight: bold; font-family: monospace; font-size: 0.8rem;">10:00</span>
            </div>
            <div class="cigarette-bar">
              <div class="cigarette-filter"></div>
              <div class="cigarette-body" id="cigarette-body" style="width: 78%;"></div>
              <div class="cigarette-ash"></div>
            </div>
          </div>

          <div class="datetime-display" id="datetime-text">MON 00:00 AM</div>
        </div>
      </div>

      <div class="chat-area">
        <div class="messages-container" id="chat-messages">
          <div class="message-bubble system">CONNECTED TO THE FREQUENCY</div>
        </div>

        <div class="typing-indicator" id="typing-indicator"></div>

        <div class="chat-input-bar">
          <input type="text" class="chat-input" id="chat-input" placeholder="Type a message..." oninput="handleTyping()" onkeydown="handleKeyPress(event)">
          <div class="chat-actions">
            <button class="btn" onclick="sendChatMessage()">SEND</button>
            <button class="btn btn-secondary" onclick="nextPartner()">NEXT</button>
            <button class="btn btn-secondary" style="color:#ff4444;" onclick="exitChat()">EXIT</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="expired-modal">
    <div class="modal-box">
      <div class="modal-title">CIGARETTE IS OUT</div>
      <div class="modal-desc">The conversation is fading. Do you want to light another one?</div>
      <div class="modal-buttons">
        <button class="btn btn-secondary" style="width:100%;" onclick="voteExtend(false)">NO</button>
        <button class="btn" style="width:100%;" onclick="voteExtend(true)">YES</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM CONTROLS -->
  <div class="bottom-controls">
    <button class="bgm-bar" onclick="toggleBGM()">
      <div class="sound-wave-icon" id="wave-icon">
        <span></span><span></span><span></span><span></span>
      </div>
      ATMOSPHERE
    </button>
    <button class="rain-toggle" onclick="toggleRain()">
      RAIN: <span id="rain-status" style="color: #fff; margin-left:6px; font-weight:bold;">ON</span>
    </button>
  </div>

  <script>
    const socket = io();

    let myNickName = "";
    let myEmoji = "";

    function parseMusicUrl(url) {
      if (!url) return null;
      try {
        const u = new URL(url);
        let title = u.hostname.replace('www.', '');

        if (u.hostname.includes('youtube.com') || u.hostname.includes('youtu.be')) {
          const v = u.searchParams.get('v');
          title = v ? `YouTube (${v})` : 'YouTube Music';
        } else if (u.hostname.includes('spotify.com')) {
          title = `Spotify Track`;
        } else if (u.hostname.includes('soundcloud.com')) {
          title = `SoundCloud Track`;
        } else {
            title = 'External Link';
        }

        return `<a href="${url}" target="_blank" rel="noopener noreferrer">🎵 ${title}</a>`;
      } catch (e) {
        return `<a href="#" style="pointer-events:none;">🎵 ${url.substring(0,18)}...</a>`;
      }
    }

    // RAIN EFFECT
    const canvas = document.getElementById('rain-canvas');
    const ctx = canvas.getContext('2d');
    let rainActive = true;
    let raindrops = [];
    const maxDrops = 150;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < maxDrops; i++) {
      raindrops.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: Math.random() * 25 + 10,
        speed: Math.random() * 8 + 6,
        opacity: Math.random() * 0.4 + 0.1
      });
    }

    function animateRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (rainActive) {
        ctx.lineWidth = 1.5;
        // สีของฝนให้ดูเย็นๆ ตัดกับความดำ
        ctx.strokeStyle = 'rgba(200, 220, 255, 0.4)'; 
        for (let drop of raindrops) {
          ctx.globalAlpha = drop.opacity;
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - (drop.speed * 0.15), drop.y + drop.length);
          ctx.stroke();

          drop.y += drop.speed;
          drop.x -= drop.speed * 0.15;

          if (drop.y > canvas.height) {
            drop.y = -30;
            drop.x = Math.random() * canvas.width;
          }
        }
      }
      requestAnimationFrame(animateRain);
    }
    animateRain();

    function toggleRain() {
      rainActive = !rainActive;
      document.getElementById('rain-status').innerText = rainActive ? "ON" : "OFF";
      document.getElementById('rain-status').style.color = rainActive ? "#fff" : "#666";
    }

    // UI CLICK SOUND
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playMouseClickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'square'; 
      osc.frequency.setValueAtTime(900, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.03);
      
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('button, select, input, .btn, .bgm-bar, .rain-toggle')) {
        playMouseClickSound();
      }
    });

    const viewLanding = document.getElementById('view-landing');
    const viewMatching = document.getElementById('view-matching');
    const viewChat = document.getElementById('view-chat');
    
    const landingOnlineCount = document.getElementById('landing-online-count');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const partnerName = document.getElementById('partner-name');
    const partnerEmoji = document.getElementById('partner-emoji');
    const partnerStatusDisplay = document.getElementById('partner-status-display');
    const partnerMusicDisplay = document.getElementById('partner-music-display');
    const myAnimalDisplay = document.getElementById('my-animal-display');
    const myStatusSelect = document.getElementById('my-status');
    const myMusicInput = document.getElementById('my-music');
    const typingIndicator = document.getElementById('typing-indicator');
    
    const timerText = document.getElementById('timer-text');
    const cigaretteBody = document.getElementById('cigarette-body');
    const datetimeText = document.getElementById('datetime-text');
    const expiredModal = document.getElementById('expired-modal');
    const bgm = document.getElementById('bgm');
    const waveIcon = document.getElementById('wave-icon');
    const matchingSubtext = document.getElementById('matching-subtext');

    let typingTimeout = null;
    let matchingInterval = null;

    const matchingPhrases = [
      "TUNING FREQUENCY...",
      "SCANNING SIGNALS...",
      "WAITING IN THE DARK...",
      "ALMOST THERE..."
    ];

    document.body.addEventListener('click', () => {
      if (bgm.paused) {
        bgm.play().then(() => { waveIcon.classList.add('playing'); }).catch(() => {});
      }
    }, { once: true });

    function toggleBGM() {
      if (bgm.paused) {
        bgm.play(); waveIcon.classList.add('playing');
      } else {
        bgm.pause(); waveIcon.classList.remove('playing');
      }
    }

    function showView(view) {
      viewLanding.classList.remove('active');
      viewMatching.classList.remove('active');
      viewChat.classList.remove('active');

      if (view === 'landing') viewLanding.classList.add('active');
      if (view === 'matching') {
        viewMatching.classList.add('active');
        startMatchingAnimation();
      } else {
        stopMatchingAnimation();
      }
      if (view === 'chat') viewChat.classList.add('active');
    }

    function startMatchingAnimation() {
      let idx = 0;
      matchingSubtext.innerText = matchingPhrases[0];
      matchingInterval = setInterval(() => {
        idx = (idx + 1) % matchingPhrases.length;
        matchingSubtext.innerText = matchingPhrases[idx];
      }, 2500);
    }

    function stopMatchingAnimation() { if (matchingInterval) clearInterval(matchingInterval); }

    function updateClock() {
      const now = new Date();
      const options = { weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      datetimeText.innerText = now.toLocaleString('en-US', options).toUpperCase();
    }
    setInterval(updateClock, 1000); updateClock();

    socket.on('hello', (data) => {
      myNickName = data.nick;
      myEmoji = data.emoji;
      myAnimalDisplay.innerText = `${data.emoji} ${data.nick}`;
    });

    socket.on('online', (count) => { landingOnlineCount.innerText = count; });
    socket.on('waiting', () => { showView('matching'); });

    socket.on('seated', (data) => {
      partnerName.innerText = data.partner;
      partnerEmoji.innerText = data.emoji;
      partnerStatusDisplay.innerText = data.status || 'AVAILABLE';
      
      const parsedMusic = parseMusicUrl(data.music);
      partnerMusicDisplay.innerHTML = parsedMusic ? parsedMusic : 'VIBE: NONE';

      chatMessages.innerHTML = `<div class="message-bubble system">CONNECTED WITH ${data.emoji} ${data.partner}</div>`;
      expiredModal.classList.remove('active');
      showView('chat');
      updateProfileInfo();
    });

    socket.on('timer-tick', (data) => {
      const totalSecs = Math.floor(data.ms / 1000);
      const mins = Math.floor(totalSecs / 60);
      const secs = totalSecs % 60;
      
      timerText.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      if (data.speedUp) {
          timerText.classList.add('speed-warning');
      } else {
          timerText.classList.remove('speed-warning');
      }

      // คำนวณความยาวบุหรี่ (ก้นกรอง 20% ดังนั้นตัวมวนจะเหลือ 80%)
      const percentage = (data.ms / (10 * 60 * 1000)) * 78;
      cigaretteBody.style.width = `${Math.max(0, percentage)}%`;
    });

    socket.on('time-expired', () => { expiredModal.classList.add('active'); });
    socket.on('time-extended', () => {
      expiredModal.classList.remove('active');
      appendMessage('system', 'EXTENDED 10 MINUTES');
    });

    socket.on('partner-profile-changed', (profile) => {
      partnerStatusDisplay.innerText = profile.status || 'AVAILABLE';
      const parsedMusic = parseMusicUrl(profile.music);
      partnerMusicDisplay.innerHTML = parsedMusic ? parsedMusic : 'VIBE: NONE';
    });

    socket.on('msg', (data) => { appendMessage('partner', data.text); });
    socket.on('typing', (on) => { typingIndicator.innerText = on ? `${partnerName.innerText} IS TYPING...` : ''; });

    socket.on('ended', (data) => {
      expiredModal.classList.remove('active');
      if (data.reason === 'time-up-new-match' || data.reason === 'partner-left') {
        appendMessage('system', 'DISCONNECTED.');
      }
      if (data.self) showView('landing');
    });

    function requestMatch() { socket.emit('sit'); }
    function cancelMatch() { socket.emit('leave'); showView('landing'); }

    function updateProfileInfo() {
      const status = myStatusSelect.value;
      const music = myMusicInput.value.trim();
      socket.emit('update-profile', { status, music });
    }

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (text) {
        socket.emit('msg', text, (res) => {
          if (res && res.err) {
            if (res.err === 'filtered') alert(`WARNING (${res.strikes}/${res.max})`);
            return;
          }
          appendMessage('me', text);
          chatInput.value = '';
          socket.emit('typing', false);
        });
      }
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendChatMessage(); }
    function handleTyping() {
      socket.emit('typing', true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { socket.emit('typing', false); }, 1500);
    }

    function voteExtend(agree) {
      socket.emit('vote-extend', agree);
      if (agree) {
        expiredModal.classList.remove('active');
        appendMessage('system', 'WAITING...');
      }
    }

    function nextPartner() { socket.emit('leave'); showView('matching'); }
    function exitChat() { socket.emit('leave'); showView('landing'); }

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message-bubble', sender);
      msgDiv.innerText = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</body>
</html>
